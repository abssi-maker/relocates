[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Public by design (shipped to the browser; access is enforced by Supabase row-level security).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
